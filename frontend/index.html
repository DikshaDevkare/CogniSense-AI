<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CogniSense AI – Login</title>
  <link rel="stylesheet" href="css/main.css"/>
  <link rel="stylesheet" href="css/login.css"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Exo+2:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body class="login-body">
  <canvas id="neural-canvas"></canvas>
  <div class="particles-container" id="particles"></div>

  <div class="login-container">
    <!-- LEFT PANEL -->
    <div class="login-left">
      <div class="brain-container">
        <div class="brain-glow-ring ring1"></div>
        <div class="brain-glow-ring ring2"></div>
        <div class="brain-glow-ring ring3"></div>
        <svg class="brain-svg" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="brainGrad" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#a855f7"/>
              <stop offset="50%" stop-color="#6366f1"/>
              <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.3"/>
            </radialGradient>
            <filter id="glow">
              <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
              <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
          </defs>
          <!-- Brain shape -->
          <ellipse cx="150" cy="130" rx="90" ry="80" fill="url(#brainGrad)" opacity="0.15" filter="url(#glow)"/>
          <path d="M80,130 Q70,90 100,70 Q130,50 150,60 Q170,50 200,70 Q230,90 220,130 Q230,160 200,175 Q180,190 150,185 Q120,190 100,175 Q70,160 80,130Z" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.8" filter="url(#glow)"/>
          <!-- Brain divisions -->
          <path d="M150,60 Q150,100 150,185" stroke="#6366f1" stroke-width="1" fill="none" opacity="0.5"/>
          <path d="M90,90 Q120,110 150,100 Q180,110 210,90" stroke="#a855f7" stroke-width="1" fill="none" opacity="0.5"/>
          <path d="M80,130 Q120,140 150,130 Q180,140 220,130" stroke="#0ea5e9" stroke-width="1" fill="none" opacity="0.5"/>
          <!-- Neural nodes -->
          <circle cx="110" cy="85" r="3" fill="#a855f7" filter="url(#glow)" class="neural-node"/>
          <circle cx="150" cy="70" r="4" fill="#6366f1" filter="url(#glow)" class="neural-node"/>
          <circle cx="190" cy="85" r="3" fill="#a855f7" filter="url(#glow)" class="neural-node"/>
          <circle cx="95" cy="120" r="3" fill="#0ea5e9" filter="url(#glow)" class="neural-node"/>
          <circle cx="205" cy="120" r="3" fill="#0ea5e9" filter="url(#glow)" class="neural-node"/>
          <circle cx="150" cy="115" r="5" fill="#a855f7" filter="url(#glow)" class="neural-node pulse-node"/>
          <circle cx="120" cy="150" r="3" fill="#6366f1" filter="url(#glow)" class="neural-node"/>
          <circle cx="180" cy="150" r="3" fill="#6366f1" filter="url(#glow)" class="neural-node"/>
          <circle cx="150" cy="170" r="4" fill="#0ea5e9" filter="url(#glow)" class="neural-node"/>
          <!-- Neural connections -->
          <line x1="110" y1="85" x2="150" y2="70" stroke="#a855f7" stroke-width="0.8" opacity="0.6"/>
          <line x1="150" y1="70" x2="190" y2="85" stroke="#a855f7" stroke-width="0.8" opacity="0.6"/>
          <line x1="95" y1="120" x2="150" y2="115" stroke="#0ea5e9" stroke-width="0.8" opacity="0.6"/>
          <line x1="150" y1="115" x2="205" y2="120" stroke="#0ea5e9" stroke-width="0.8" opacity="0.6"/>
          <line x1="110" y1="85" x2="95" y2="120" stroke="#6366f1" stroke-width="0.8" opacity="0.6"/>
          <line x1="190" y1="85" x2="205" y2="120" stroke="#6366f1" stroke-width="0.8" opacity="0.6"/>
          <line x1="120" y1="150" x2="150" y2="115" stroke="#a855f7" stroke-width="0.8" opacity="0.6"/>
          <line x1="180" y1="150" x2="150" y2="115" stroke="#a855f7" stroke-width="0.8" opacity="0.6"/>
          <line x1="120" y1="150" x2="150" y2="170" stroke="#6366f1" stroke-width="0.8" opacity="0.6"/>
          <line x1="180" y1="150" x2="150" y2="170" stroke="#6366f1" stroke-width="0.8" opacity="0.6"/>
          <!-- Outer glow circle -->
          <circle cx="150" cy="130" r="100" fill="none" stroke="#a855f7" stroke-width="0.5" opacity="0.2" stroke-dasharray="4 8"/>
          <circle cx="150" cy="130" r="115" fill="none" stroke="#0ea5e9" stroke-width="0.3" opacity="0.15" stroke-dasharray="2 12"/>
        </svg>
      </div>
      <div class="login-hero-text">
        <h1>AI-Based<br/><span class="gradient-text">Cognitive Load<br/>Detection</span></h1>
        <p>Using Facial Micro-Expressions</p>
      </div>
      <div class="tagline">Focus Better. Learn Smarter.</div>
    </div>

    <!-- RIGHT PANEL -->
    <div class="login-right">
      <div class="login-card">
        <div class="login-card-header">
          <div class="logo-badge">
            <svg width="28" height="28" viewBox="0 0 32 32" fill="none">
              <circle cx="16" cy="16" r="14" stroke="#a855f7" stroke-width="1.5"/>
              <circle cx="16" cy="16" r="8" fill="#a855f7" opacity="0.3"/>
              <circle cx="16" cy="16" r="3" fill="#a855f7"/>
            </svg>
            <span>CogniSense AI</span>
          </div>
          <h2>Welcome Back</h2>
          <p>Sign in to continue your session</p>
        </div>

        <form class="login-form" onsubmit="handleLogin(event)">
          <div class="input-group">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
            <input type="text" id="username" placeholder="Username" autocomplete="off"/>
            <div class="input-border"></div>
          </div>

          <div class="input-group">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <input type="password" id="password" placeholder="Password" id="pwd"/>
            <button type="button" class="toggle-pwd" onclick="togglePassword()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
            <div class="input-border"></div>
          </div>

          <button type="submit" class="btn-signin">
            <span class="btn-text">Sign In</span>
            <div class="btn-glow"></div>
          </button>
        </form>

        <div class="login-divider"><span>or</span></div>

        <button class="btn-create" onclick="handleCreateAccount()">Create Account</button>

        <p class="login-footer">Focus Better. Learn Smarter.</p>
      </div>
    </div>
  </div>

  <script src="js/particles.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
